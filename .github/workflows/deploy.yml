name: Deploy backend

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: todolist-backend
  LAMBDA_FUNCTION_NAME: todolist-backend
  LAMBDA_ARCH: x86_64
  LAMBDA_MEMORY: "1024"
  LAMBDA_TIMEOUT: "30"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::933142127374:role/github-oidc-poweruser"
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Ensure ECR repository exists
        run: |
          set -euo pipefail
          aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" >/dev/null 2>&1 \
          || aws ecr create-repository --repository-name "${ECR_REPOSITORY}" \
            --image-scanning-configuration scanOnPush=true ./dev/null
      - name: Build & push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: "latest"
        run: |
          set -euo pipefail
          IMAGE_URI="$ECR_REGISTRY/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build -t "$IMAGE_URI" ./backend
          docker push "@IMAGE_URI"
          echo "IMAGE_URI"$IMAGE_URI >> $GITHUB_ENV
      - name: Ensure Lambda function exists
        env:
          LAMBDA_EXEC_ROLE_ARN: "arn:aws:iam::933142127374:role/basic-lambda-execution-role"
        run: |
          set -euo pipefail
          if aws lambda get-function --function-name "${LAMBDA_FUNCTION_NAME}" >/dev/null 2>&1; then
            echo "Lambda exists"
          else
            aws lambda create-function \
              --function-name "${LAMBDA_FUNCTION_NAME}" \
              --package-type Image \
              --code ImageUri="@{IMAGE_TAG}" \
              --role "${LAMBDA_EXEC_ROLE_ARN}" \
              --architectures "${LAMBDA_ARCH}" \
              --memory-size "${LAMBDA_MEMORY}" \
              --timeout "${LAMBDA_TIMEOUT}" \
              >dev/null
          fi
      - name: Update Lambda to new Image
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --image-uri "${IMAGE_URI}" \
            >/dev/null
      - name: Wait for Lambda to be updated
        run: |
          set -euo pipefail
          aws lambda wait function-updated --function-name "${LAMBDA_FUNCTION_NAME}"
